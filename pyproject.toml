[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cellbridge"
version = "0.1.0"
description = "Molecularly guided cell classification and ontology-aware conformal prediction from pathology images"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.11"
authors = [{name = "CellBridge authors"}]
keywords = ["pathology", "spatial transcriptomics", "conformal prediction", "cell classification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "Pillow>=10",
  "PyYAML>=6",
]

[project.optional-dependencies]
models = [
  "torch>=2.2",
  "torchvision>=0.17",
  "timm>=0.9.16,<2",
  "huggingface-hub>=0.24",
  "transformers>=4.51,<5",
  "safetensors>=0.4",
  "opencv-python>=4.8",
]
data = [
  "anndata>=0.10",
  "pyarrow>=14",
  "geopandas>=0.14",
  "shapely>=2",
  "lmdb>=1.4",
  "tifffile>=2025.5.10",
  "zarr>=3,<4",
  "imagecodecs>=2025.3.30",
]
preprocess = ["cellbridge[data]", "scanpy>=1.10", "datasets>=2.18"]
analysis = [
  "cellbridge[data]",
  "matplotlib>=3.8",
  "ipywidgets>=8",
  "ipython>=8",
  "jupyterlab>=4",
  "umap-learn>=0.5.6",
  "tabulate>=0.9",
]
wandb = ["wandb>=0.17"]
dev = ["pytest>=8", "build>=1.2", "ruff>=0.3.5", "twine>=5"]

[project.urls]
Repository = "https://github.com/Lotfollahi-lab/cellbridge"

[project.scripts]
cellbridge-infer = "cellbridge.inference.run:main"
cellbridge-train = "cellbridge.train.lora.train:main"
cellbridge-finetune = "cellbridge.train.finetune.train:main"
cellbridge-granularity = "cellbridge.inference.granularity.run:main"
cellbridge-granularity-refit = "cellbridge.inference.granularity.refit:main"
cellbridge-config = "cellbridge.config:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cellbridge"]

[tool.hatch.build.targets.wheel.force-include]
"configs/inference" = "cellbridge/configs/inference"
"configs/train" = "cellbridge/configs/train"
"configs/preprocess" = "cellbridge/configs/preprocess"
"configs/analysis" = "cellbridge/configs/analysis"

[tool.hatch.build.targets.sdist]
include = ["/src", "/configs", "/scripts", "/tests", "/reproducibility_guide.md", "/cellbridge.jpg", "/requirements", "/notebooks", "/README.md", "/pyproject.toml", "/AGENTS.md", "/LICENSE*", "/NOTICE*", "/.github"]
exclude = ["**/__pycache__", "**/.ipynb_checkpoints", "/configs/local.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
