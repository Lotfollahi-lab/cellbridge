# Descriptive analysis of existing frozen TERRA cell embeddings. No training.
data_root: ${CELLBRIDGE_DATA_ROOT}/train/hest
sample_ids:
  - TENX191
  - TENX192
  - TENX193
  - TENX194
  - TENX195
  - TENX196
  - TENX197
  - TENX198
  - TENX199
  - TENX200
  - TENX201
  - TENX202

embedding_key: cell_emb
label_id_column: cell_id
label_column: group

# Cells are balanced within each sample/phenotype. Pair strata are then sampled
# uniformly, so large samples and common tumor clusters do not dominate.
sampling:
  seed: 17
  max_cells_per_phenotype_per_sample: 512
  pairs_per_relation: 50000
  ordering_triplets: 50000

output_dir: outputs/exploration/terra_phenotype_structure
