# Held-out patient-4 subset of the exact CellBridge ordering metric.
data_root: ${CELLBRIDGE_DATA_ROOT}/train/hest
sample_ids:
  - TENX200
  - TENX201
  - TENX202

embedding_key: cell_emb
label_id_column: cell_id
label_column: group

sampling:
  seed: 17
  max_cells_per_phenotype_per_sample: 512
  pairs_per_relation: 50000
  ordering_triplets: 50000

output_dir: outputs/exploration/terra_phenotype_structure_breast_test
