dataset: phenocell

data:
  format: tiled_lmdb
  lmdb: ${CELLBRIDGE_DATA_ROOT}/eval/phenocell/phenocell_lmdb
  metadata: ${CELLBRIDGE_DATA_ROOT}/eval/phenocell/phenocell_info.csv
  split: ${CELLBRIDGE_DATA_ROOT}/eval/phenocell/splits/phenocell_dataset_split.csv
  image_shape: [1440, 1920]
  tile_size: 224
  value_scale: 250
  source_mpp: 0.377

methods: [uni, cellbridge, past, volta, spatialwhisperer]

probe:
  tasks: [all, immune]
  methods: [linear, knn]
  pca_components: 256
  seed: 0
  linear:
    Cs: [0.1, 1, 10]
    max_iter: 2000
  knn:
    n_neighbors: 20

conformal:
  alpha: 0.1
  min_class_count_per_split: 20
  mapping: ${CELLBRIDGE_ROOT}/configs/preprocess/cell_ontology/phenocell.yaml
  ontology: ${CELLBRIDGE_ROOT}/configs/preprocess/cell_ontology/cl-2026-06-08.yaml
  branch_roots:
    - CL:0000542  # lymphocyte
    - CL:0000094  # granulocyte
    - CL:0000113  # mononuclear phagocyte
    - CL:0002320  # connective tissue cell
    - CL:0000115  # endothelial cell
    - CL:0000192  # smooth muscle cell
    - CL:0001061  # abnormal cell
  output_subdir: conformal_prediction
