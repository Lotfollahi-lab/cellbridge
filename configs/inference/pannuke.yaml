dataset: pannuke

data:
  format: tiled_lmdb
  lmdb: ${CELLBRIDGE_DATA_ROOT}/eval/pannuke/pannuke_lmdb
  metadata: ${CELLBRIDGE_DATA_ROOT}/eval/pannuke/pannuke_info.csv
  split: ${CELLBRIDGE_DATA_ROOT}/eval/pannuke/splits/train_test_val_split.csv
  image_shape: [256, 256]
  tile_size: 224
  value_scale: 1
  source_mpp: 0.25
  allow_unlabeled_samples: true
  skip_missing_cells: true

methods: [uni, cellbridge, past, volta, spatialwhisperer]

probe:
  tasks: [all]
  methods: [linear, knn]
  pca_components: 256
  seed: 0
  bootstrap:
    group_column: sample_id
    n_resamples: 1000
    seed: 0
  linear:
    Cs: [0.1, 1, 10]
    max_iter: 2000
  knn:
    n_neighbors: 20

conformal:
  alpha: 0.1
  min_class_count_per_split: 20
  mapping: ${CELLBRIDGE_ROOT}/configs/preprocess/cell_ontology/pannuke.yaml
  ontology: ${CELLBRIDGE_ROOT}/configs/preprocess/cell_ontology/cl-2026-06-08.yaml
  branch_roots:
    - CL:0000066  # epithelial cell
    - CL:0002320  # connective tissue cell
    - CL:0000738  # leukocyte
    - CL:0001063  # neoplastic cell
  output_subdir: conformal_prediction
