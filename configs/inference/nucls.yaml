dataset: nucls

data:
  format: nucls
  images: ${CELLBRIDGE_DATA_ROOT}/eval/nucls/raw/rgb
  metadata: ${CELLBRIDGE_DATA_ROOT}/eval/nucls/nucls_info.csv
  split: ${CELLBRIDGE_DATA_ROOT}/eval/nucls/splits/train_test_val_split.csv
  source_mpp: 0.2
  exclude_labels: [unlabeled]
  allow_unlabeled_samples: true

methods: [uni, cellbridge, past, volta, spatialwhisperer]

probe:
  tasks: [all]
  methods: [linear, knn]
  pca_components: 256
  seed: 0
  linear:
    Cs: [0.1, 1, 10]
    max_iter: 2000
  knn:
    n_neighbors: 20

conformal:
  alpha: 0.1
  min_class_count_per_split: 20
  mapping: ${CELLBRIDGE_ROOT}/configs/preprocess/cell_ontology/nucls.yaml
  ontology: ${CELLBRIDGE_ROOT}/configs/preprocess/cell_ontology/cl-2026-06-08.yaml
  branch_roots:
    - CL:0000094  # granulocyte
    - CL:0000542  # lymphocyte
    - CL:0000066  # epithelial cell
    - CL:0000113  # mononuclear phagocyte
    - CL:0000115  # endothelial cell
    - CL:0000499  # stromal cell
    - CL:0001061  # abnormal cell
  output_subdir: conformal_prediction
