       CL:0001061, CL:4033054]
    TENX192: [CL:0000542, CL:0000763, CL:0000066, CL:0000115, CL:0002320, CL:0001061]
    TENX193: [CL:0000542, CL:0000763, CL:0000066, CL:0000115, CL:0002320, CL:0001061]
