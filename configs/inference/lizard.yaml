dataset: lizard

data:
  format: tiled_lmdb
  lmdb: ${CELLBRIDGE_DATA_ROOT}/eval/lizard/lizard_lmdb
  metadata: ${CELLBRIDGE_DATA_ROOT}/eval/lizard/lizard_info.csv
  split: ${CELLBRIDGE_DATA_ROOT}/eval/lizard/splits/lizard_default_train_test_val_split.csv
  tile_size: 224
  value_scale: 1
  source_mpp: 0.5

methods: [uni, cellbridge, past, volta, spatialwhisperer, lemon, virchow2, hibou_l]

probe:
  tasks: [all]
  methods: [linear, knn]
  pca_components: 256
  seed: 0
  bootstrap:
    min_test_support: 20
    group_column: sample_id
    n_resamples: 1000
    seed: 0
  linear:
    Cs: [0.1, 1, 10]
    max_iter: 2000
  knn:
    n_neighbors: 20

conformal:
  alpha: 0.1
  min_class_count_per_split: 20
  mapping: ${CELLBRIDGE_ROOT}/configs/preprocess/cell_ontology/lizard.yaml
  ontology: ${CELLBRIDGE_ROOT}/configs/preprocess/cell_ontology/cl-2026-06-08.yaml
  branch_roots:
    - CL:0000094  # granulocyte
    - CL:0000542  # lymphocyte
    - CL:0000066  # epithelial cell
    - CL:0002320  # connective tissue cell
  output_subdir: conformal_prediction
