# UNI2 -> TERRA molecular prototype classification.
distill_version: v1
run_name: distill_v1_prototype_k64

data_root: /lustre/scratch126/cellgen/lotfollahi/so25/data/train/hest
splits_path: /lustre/scratch126/cellgen/lotfollahi/so25/data/train/hest/splits/hest80_strict_v1.csv
max_cells_per_sample: 50000
sampling_seed: 0

uni_key: uni_emb
terra_key: cell_emb
uni_dim: 1536
hidden_dim: 1024
feat_dim: 512
dropout: 0.1

# TERRA prototypes. MiniBatchKMeans is used for the 500k-cell fit.
num_prototypes: 64
kmeans_seed: 0
max_cells_for_kmeans: 500000
kmeans_batch_size: 8192
kmeans_max_iter: 100
kmeans_n_init: 3
assignment_batch_size: 65536

# Student optimization.
use_class_weights: false
class_weight_clip: [0.25, 4.0]
batch_size: 8192
inference_batch_size: 8192
lr: 3.0e-4
weight_decay: 1.0e-4
max_epochs: 100
patience: 10
num_workers: 8
seed: 0

output_dir: outputs/distill_v1_k64
checkpoint_dir: checkpoints/distill_v1_k64
cache_dir: outputs/distill_v0/cache

wandb:
  enabled: true
  project: terra-uni-distillation
  group: distill_v1
  name: distill_v1_prototype_k64
  mode: online

eval:
  label_test_mode: fast  # choices: fast, full
  label_test_fast_path: /lustre/scratch126/cellgen/lotfollahi/so25/data/train/hest/splits/label_test_fast_v1.csv
  label_test_fast_n: 5
  label_test_fast_seed: 0
  test_frac: 0.2
  split_axis: y
  pca: true
  uni_pca_components: 256
  methods: [linear, knn]
  Cs: [0.1, 1, 10]
  knn_neighbors: 20
  knn_metric: cosine
  knn_weights: uniform
  class_weight: balanced
  label_column: group
  label_id_column: cell_id
  min_class_count: 25
