# Frozen UNI2 embeddings -> TERRA cell embeddings.
run_name: distill_v0

# Data and fixed sample split.
data_root: ${CELLBRIDGE_DATA_ROOT}/train/hest
splits_path: ${CELLBRIDGE_DATA_ROOT}/train/hest/splits/hest80_strict_v1.csv

# Used when creating the split file.
val_frac: 0.1
split_seed: 0

# Deterministic train/validation subsampling.
max_cells_per_sample: 50000
sampling_seed: 0

# Embeddings.
uni_key: uni_emb
terra_key: cell_emb
uni_dim: 1536
terra_dim: 384

# Projector.
hidden_dim: 1024
dropout: 0.1

# Optimization.
batch_size: 8192
lr: 3.0e-4
weight_decay: 1.0e-4
lambda_cos: 1.0
lambda_var: 0.1
lambda_cov: 0.01
var_gamma: 1.0
max_epochs: 100
patience: 10
num_workers: 8
seed: 0

# Outputs.
output_dir: outputs/distill_v0
checkpoint_dir: checkpoints/distill_v0
cache_dir: outputs/distill_v0/cache

# Optional W&B logging.
wandb:
  enabled: true
  project: terra-uni-distillation
  group: distill_v0
  name: null
  mode: online

# Held-out linear and kNN evaluation.
eval:
  label_test_mode: fast  # choices: fast, full
  label_test_fast_path: ${CELLBRIDGE_DATA_ROOT}/train/hest/splits/label_test_fast_v1.csv
  label_test_fast_n: 5
  label_test_fast_seed: 0
  test_frac: 0.2
  split_axis: y
  pca: true
  uni_pca_components: 256
  methods: [linear, knn]
  Cs: [0.1, 1, 10]
  knn_neighbors: 20
  knn_metric: cosine
  knn_weights: uniform
  class_weight: balanced
  label_column: group
  label_id_column: cell_id
  min_class_count: 25
