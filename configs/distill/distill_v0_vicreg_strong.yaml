# VICReg-style v0 with stronger regularization.
run_name: distill_v0_vicreg_strong

data_root: /lustre/scratch126/cellgen/lotfollahi/so25/data/train/hest
splits_path: /lustre/scratch126/cellgen/lotfollahi/so25/data/train/hest/splits/hest80_strict_v1.csv
val_frac: 0.1
split_seed: 0
max_cells_per_sample: 50000
sampling_seed: 0

uni_key: uni_emb
terra_key: cell_emb
uni_dim: 1536
terra_dim: 384
hidden_dim: 1024
dropout: 0.1

batch_size: 8192
lr: 3.0e-4
weight_decay: 1.0e-4
lambda_cos: 1.0
lambda_var: 1.0
lambda_cov: 0.04
var_gamma: 1.0
max_epochs: 100
patience: 10
num_workers: 8
seed: 0

output_dir: outputs/distill_v0_vicreg_strong
checkpoint_dir: checkpoints/distill_v0_vicreg_strong
cache_dir: outputs/distill_v0/cache

wandb:
  enabled: true
  project: terra-uni-distillation
  group: distill_v0
  name: distill_v0_vicreg_strong
  mode: online

eval:
  label_test_mode: fast  # choices: fast, full
  label_test_fast_path: /lustre/scratch126/cellgen/lotfollahi/so25/data/train/hest/splits/label_test_fast_v1.csv
  label_test_fast_n: 5
  label_test_fast_seed: 0
  test_frac: 0.2
  split_axis: y
  pca: true
  uni_pca_components: 256
  Cs: [0.1, 1, 10]
  class_weight: balanced
  label_column: group
  label_id_column: cell_id
  min_class_count: 25
