# OOD cell-phenotyping probe. No spatial-transcriptomics data are used here.
data:
  lmdb: ${CELLBRIDGE_DATA_ROOT}/eval/phenocell/phenocell_lmdb
  metadata: ${CELLBRIDGE_DATA_ROOT}/eval/phenocell/phenocell_info.csv
  split: ${CELLBRIDGE_DATA_ROOT}/eval/phenocell/splits/phenocell_dataset_split.csv
  image_shape: [1440, 1920]
  tile_size: 224
  value_scale: 250
  source_mpp: 0.377

embedding:
  encoder: uni_v2
  # Match the 224 px x 0.5 um/px CellBridge training field of view.
  fov_um: 112.0
  target_size: 224
  interpolation: bilinear
  batch_size: 128
  output_dir: ${CELLBRIDGE_DATA_ROOT}/eval/phenocell/embeddings/uni_v2/fov_112um

projection:
  checkpoint: checkpoints/distill_v0/best.pt
  batch_size: 8192

probe:
  tasks: [all, immune]
  methods: [linear, knn]
  Cs: [0.1, 1, 10]
  knn_neighbors: 20
  knn_metric: cosine
  knn_weights: uniform
  protocols:
    # Exact previous asymmetry, retained only for historical comparison.
    historical:
      class_weight: balanced
      knn_reference_sampling: all
    natural:
      class_weight: null
      knn_reference_sampling: all
    equal_class:
      class_weight: balanced
      knn_reference_sampling: balanced
  uni_pca_components: 256
  max_iter: 2000
  seed: 0

output_dir: outputs/evaluation/phenocell_fov112_distill_v0
