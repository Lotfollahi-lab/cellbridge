# OOD cell-phenotyping probe on Lizard. No spatial-transcriptomics data are used here.
data:
  lmdb: ${CELLBRIDGE_DATA_ROOT}/eval/lizard/lizard_lmdb
  metadata: ${CELLBRIDGE_DATA_ROOT}/eval/lizard/lizard_info.csv
  split: ${CELLBRIDGE_DATA_ROOT}/eval/lizard/splits/lizard_default_train_test_val_split.csv
  # Original Lizard regions were sampled at 20x (~0.5 um/pixel).
  source_mpp: 0.5
  # Variable rectangular layouts are inferred from padded content and tile seams.
  tile_size: 224
  value_scale: 1

embedding:
  encoder: uni_v2
  crop_size: 96
  batch_size: 128
  output_dir: ${CELLBRIDGE_DATA_ROOT}/eval/lizard/embeddings/uni_v2/crop_96px

probe:
  tasks: [all]
  methods: [linear, knn]
  Cs: [0.1, 1, 10]
  knn_neighbors: 20
  knn_metric: cosine
  knn_weights: uniform
  class_weight: balanced
  uni_pca_components: 256
  max_iter: 2000
  seed: 0

output_dir: ${CELLBRIDGE_OUTPUTS_ROOT}/evaluation/lizard_crop96_lora
