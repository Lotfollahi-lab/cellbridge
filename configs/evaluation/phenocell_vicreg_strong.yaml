# OOD cell-phenotyping probe. No spatial-transcriptomics data are used here.
data:
  lmdb: ${CELLBRIDGE_DATA_ROOT}/eval/phenocell/phenocell_lmdb
  metadata: ${CELLBRIDGE_DATA_ROOT}/eval/phenocell/phenocell_info.csv
  split: ${CELLBRIDGE_DATA_ROOT}/eval/phenocell/splits/phenocell_dataset_split.csv
  image_shape: [1440, 1920]
  tile_size: 224
  value_scale: 250

embedding:
  encoder: uni_v2
  crop_size: 96
  batch_size: 128
  output_dir: ${CELLBRIDGE_DATA_ROOT}/eval/phenocell/embeddings/uni_v2/crop_96px

projection:
  checkpoint: checkpoints/distill_v0_vicreg_strong/best.pt
  batch_size: 8192

probe:
  tasks: [all, immune]
  methods: [linear, knn]
  Cs: [0.1, 1, 10]
  knn_neighbors: 20
  knn_metric: cosine
  knn_weights: uniform
  class_weight: balanced
  uni_pca_components: 256
  max_iter: 2000
  seed: 0

output_dir: outputs/evaluation/phenocell_crop96_vicreg_strong
