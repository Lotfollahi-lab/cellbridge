# PanNuke OOD probe for a LoRA checkpoint. Crops are re-encoded through the
# adapted encoder, so no cached UNI embeddings and no projection head are used.
data:
  lmdb: ${TERRA_MULTI_DATA_ROOT}/eval/pannuke/pannuke_lmdb
  metadata: ${TERRA_MULTI_DATA_ROOT}/eval/pannuke/pannuke_info.csv
  split: ${TERRA_MULTI_DATA_ROOT}/eval/pannuke/splits/train_test_val_split.csv
  image_shape: [256, 256]
  tile_size: 224
  value_scale: 1
  allow_unlabeled_samples: true

embedding:
  crop_size: 96
  batch_size: 128

probe:
  tasks: [all]
  methods: [linear, knn]
  Cs: [0.1, 1, 10]
  knn_neighbors: 20
  knn_metric: cosine
  knn_weights: uniform
  class_weight: balanced
  uni_pca_components: 256
  max_iter: 2000
  seed: 0

output_dir: outputs/evaluation/pannuke_crop96_lora_k0
