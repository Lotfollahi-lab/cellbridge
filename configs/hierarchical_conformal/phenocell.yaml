alpha: 0.1
seed: 0
pca_components: 256

data:
  feature_manifest: ${CELLBRIDGE_ROOT}/outputs/hierarchical/lora_baseline/evaluation/phenocell/features/manifest.csv
  official_split: ${CELLBRIDGE_DATA_ROOT}/eval/phenocell/splits/phenocell_dataset_split.csv
  exclude_labels: [Other cells]

representations:
  UNI: uni_original
  CellBridge: lora_adapted
  CellBridge projected: lora_projected
classifier:
  C: 1.0
  class_weight: balanced
  max_iter: 2000

hierarchy:
  root: cell
  edges:
    - [cell, epithelial cell]
    - [cell, hematopoietic cell]
    - [cell, neural cell]
    - [cell, stromal cell]
    - [cell, vascular cell]
    - [epithelial cell, neoplastic epithelial]
    - [neoplastic epithelial, Tumor cells]
    - [hematopoietic cell, lymphoid cell]
    - [hematopoietic cell, myeloid cell]
    - [lymphoid cell, B cells]
    - [lymphoid cell, NK cells]
    - [lymphoid cell, Plasma cells]
    - [lymphoid cell, T cells]
    - [myeloid cell, Dendritic cells]
    - [myeloid cell, Granulocytes]
    - [myeloid cell, Macrophages/Monocytes]
    - [neural cell, neural lineage]
    - [neural lineage, Nerves]
    - [stromal cell, adipose lineage]
    - [stromal cell, mural lineage]
    - [stromal cell, stromal lineage]
    - [adipose lineage, Adipocytes]
    - [mural lineage, Smooth muscle]
    - [stromal lineage, Stroma]
    - [vascular cell, endothelial lineage]
    - [endothelial lineage, Vasculature/Lymphatics]

output_dir: outputs/hierarchical_conformal/phenocell_alpha0.1
