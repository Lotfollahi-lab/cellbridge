distill_version: lora
run_name: lora_contrastive_k0

data_root: /lustre/scratch126/cellgen/lotfollahi/so25/data/train/hest
manifest_path: /lustre/scratch126/cellgen/lotfollahi/so25/data/train/hest/manifest.csv
splits_path: /lustre/scratch126/cellgen/lotfollahi/so25/data/train/hest/splits/hest80_strict_v1.csv
max_cells_per_sample: 5000
max_open_wsis: 64
sampling_seed: 0
terra_key: cell_emb

crop:
  target_size: 224
  target_pixel_size_um: 0.5

model:
  trainable_blocks: last_2
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.05
  image_dim: 1536
  terra_dim: 384
  gex_hidden_dim: 1024
  gex_dropout: 0.1

objective:
  mode: contrastive
  lambda_contrastive: 1.0
  lambda_gex: 1.0
  temperature: 0.07
  gex_loss: smooth_l1

training:
  batch_size: 16
  max_steps: 20000
  eval_every: 1000
  patience: 5
  lr_lora: 1.0e-4
  lr_heads: 3.0e-4
  weight_decay: 1.0e-4
  precision: bf16
  num_workers: 8
  seed: 0
  log_every: 20

output_dir: outputs/lora/contrastive_k0
checkpoint_dir: checkpoints/lora/contrastive_k0
phenocell_config: configs/evaluation/phenocell.yaml

wandb:
  enabled: true
  project: terra-uni-distillation
  group: distill_lora
  name: lora_contrastive_k0
  mode: online

eval:
  label_test_fast_path: /lustre/scratch126/cellgen/lotfollahi/so25/data/train/hest/splits/label_test_fast_v1.csv
  label_test_fast_n: 5
  batch_size: 64
  num_workers: 8
  test_frac: 0.2
  split_axis: y
  pca: true
  uni_pca_components: 256
  Cs: [0.1, 1, 10]
  class_weight: balanced
  label_column: group
  label_id_column: cell_id
  min_class_count: 25
