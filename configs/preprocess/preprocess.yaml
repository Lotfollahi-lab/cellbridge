# HEST-1k preprocessing.
# Step 1 (discovery) reads this to enumerate the samples to process.

# HEST-1k release root (read-only public dataset).
hest_root: ${HEST_ROOT}
metadata_csv: HEST_v1_3_0.csv   # relative to hest_root

# Sample filter: which sections to preprocess.
species: Homo sapiens
technologies: [Xenium, Xenium 5k]

# Step 2 (QC): Xenium Q-Value cutoff for keeping a transcript call.
qv_threshold: 20

# Step 3 (cell labels): a cell whose polygon holds no CellViT nucleus is
# labelled by its nearest nucleus, unless that nucleus is farther than this.
fallback_max_um: 20

# Step 4 (TERRA): keep the tokenized dataset after embedding (a resumable
# scratch artifact, deleted on success by default). Set true only to re-embed
# the same tokens repeatedly.
keep_tokenized: false

# Per-sample outputs (manifest + embeddings + labels) live under here.
output_root: ${CELLBRIDGE_DATA_ROOT}/train/hest
