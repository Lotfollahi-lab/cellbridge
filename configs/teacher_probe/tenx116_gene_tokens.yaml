experiment: terra_gene_token_probe_v1
sample_id: TENX116

adata_path: ${CELLBRIDGE_DATA_ROOT}/train/hest/TENX116/TENX116.h5ad
labels_path: ${CELLBRIDGE_DATA_ROOT}/train/hest/TENX116/TENX116_granular_cell_labels.csv
terra_embeddings: ${CELLBRIDGE_DATA_ROOT}/train/hest/TENX116/TENX116_terra.npz
pixel_size_um: 0.136887203675011

gene_tokens_path: ${CELLBRIDGE_ROOT}/outputs/teacher_probe/tenx116/gene_tokens.h5
output_dir: ${CELLBRIDGE_ROOT}/outputs/teacher_probe/tenx116/results

# Cells are selected without labels after full-sample harmonization/tokenization,
# so their TERRA neighborhood context still comes from the complete section.
selection:
  method: blake2b_cell_id
  seed: 0
  max_cells: 25000

smoke:
  max_cells: 2048
  batch_size: 32
  min_class_count: 5
  gene_tokens_path: ${CELLBRIDGE_ROOT}/outputs/teacher_probe/tenx116_smoke/gene_tokens.h5
  output_dir: ${CELLBRIDGE_ROOT}/outputs/teacher_probe/tenx116_smoke/results

extraction:
  model_name: Lotfollahi-lab/TERRA-112M
  model_revision: 00d1c977e49364ba10c28692abcbd102e115bf91
  terra_version: 0.1.7
  min_genes_per_cell: 10
  min_cells_per_gene: 10
  batch_size: 128
  num_workers: 12
  nproc: 12
  pin_memory: true
  tokenized_path: ${CELLBRIDGE_ROOT}/outputs/teacher_probe/cache/TENX116_tokenized
  keep_tokenized: true

eval:
  n_splits: 5
  spatial_block_size_um: 500.0
  gene_pca_components: 4
  seed: 0
  Cs: [0.1, 1, 10]
  class_weight: balanced
  max_iter: 2000
  label_id_column: cell_id
  label_column: group
  min_class_count: 25

plots:
  top_genes: 6
  max_points: 5000

# Immune, epithelial, endocrine, acinar, vascular, smooth-muscle and stromal
# markers measured by the TENX116 panel and present in the pinned token dictionary.
genes:
  - PTPRC
  - CD3D
  - CD3E
  - CD8A
  - MS4A1
  - CD79A
  - CD68
  - CD163
  - FCGR3A
  - NKG7
  - GNLY
  - GZMB
  - KIT
  - CPA3
  - MS4A2
  - EPCAM
  - KRT7
  - KRT20
  - CFTR
  - AMY2A
  - INS
  - GCG
  - PECAM1
  - VWF
  - ACTA2
  - MYH11
  - SFRP2
  - PDGFRA

