jepa_version: spatial_block_v1
run_name: jepa_spatial_block_v1

data_root: ${TERRA_MULTI_DATA_ROOT}/train/hest
manifest_path: ${TERRA_MULTI_DATA_ROOT}/train/hest/manifest.csv
splits_path: ${TERRA_MULTI_DATA_ROOT}/train/hest/splits/hest80_strict_v1.csv
uni_key: uni_emb
terra_key: cell_emb

data:
  max_anchor_cells_per_section: 100000
  max_open_sections: 64
  sampling_seed: 0
  target_cells: 8
  target_sampling: anchor_plus_nearest
  context_cells: 64
  context_sampling: uniform_within_radius
  context_radius_um: 300.0
  guard_radius_um: 80.0
  coordinate_normalization: fixed_radius
  windows_per_section: 128
  max_sampling_attempts: 32

model:
  image_dim: 1536
  target_dim: 384
  model_dim: 384
  num_heads: 8
  context_depth: 4
  predictor_depth: 2
  dropout: 0.1

training:
  batch_size: 8
  max_epochs: 50
  patience: 7
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  precision: bf16
  num_workers: 0
  seed: 0

output_dir: outputs/jepa/spatial_block_v1
checkpoint_dir: checkpoints/jepa/spatial_block_v1

wandb:
  enabled: true
  project: terra-uni-distillation
  group: jepa
  name: jepa_spatial_block_v1
  mode: online

eval:
  label_test_fast_path: ${TERRA_MULTI_DATA_ROOT}/train/hest/splits/label_test_fast_v1.csv
  batch_size: 128
  test_frac: 0.2
  split_axis: y
  pca: true
  uni_pca_components: 256
  methods: [linear, knn]
  Cs: [0.1, 1, 10]
  knn_neighbors: 20
  knn_metric: cosine
  knn_weights: uniform
  class_weight: balanced
  label_column: group
  label_id_column: cell_id
  min_class_count: 25
