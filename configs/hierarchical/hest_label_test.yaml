# Portable inputs for all 15 annotated HEST label-test samples.
data_root: ${CELLBRIDGE_DATA_ROOT}/train/hest
splits_path: ${CELLBRIDGE_DATA_ROOT}/train/hest/splits/hest80_strict_v1.csv
split: label_test
labels_pattern: "{data_root}/{sample_id}/{sample_id}_granular_cell_labels.csv"
label_id_column: cell_id
label_column: group

# Fail loudly if the fixed cohort or label inventory changes.
expected_samples: 15
expected_source_labels: 166
expected_normalized_labels: 91
expected_cells: 4610387

materialize_cells: true
output_dir: ${CELLBRIDGE_ROOT}/outputs/hierarchical/hest_label_test
