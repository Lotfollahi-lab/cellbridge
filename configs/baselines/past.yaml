baseline:
  name: past
  embedding_dim: 1024
  normalized: false
  save_dtype: float16

model:
  repository: ${CELLBRIDGE_REPOS_ROOT}/past_sc
  hf_repo: Boyoungc/PAST
  revision: 8c1abe3c955f80fd1b14dc74431bcb4cf2faede2
  checkpoint: ${CELLBRIDGE_REPOS_ROOT}/past_sc/checkpoints/checkpoint-context300.pth
  checkpoint_size: 4085228034
  checkpoint_sha256: 47a885fadbcde102e380f6e1e1229878dbc2969f7621187e8ec2782d816271a8

# The released loader takes a 224x224 level-0 crop around each cell and does
# not resample to a common physical resolution.
crop:
  geometry: cell_center
  source_size: 224
  padding: black

output_dir: ${CELLBRIDGE_OUTPUTS_ROOT}/baselines/past

hest:
  data_root: ${CELLBRIDGE_DATA_ROOT}/train/hest
  manifest_path: ${CELLBRIDGE_DATA_ROOT}/train/hest/manifest.csv
  splits_path: ${CELLBRIDGE_DATA_ROOT}/train/hest/splits/hest80_strict_v1.csv
  label_test_fast_path: ${CELLBRIDGE_DATA_ROOT}/train/hest/splits/label_test_fast_v1.csv
  label_test_fast_n: 5
  extraction:
    batch_size: 64
    num_workers: 8
  probe: &probe
    methods: [linear, knn]
    pca: false
    Cs: [0.1, 1, 10]
    knn_neighbors: 20
    knn_metric: cosine
    knn_weights: uniform
    class_weight: balanced
    max_iter: 2000
    seed: 0
    test_frac: 0.2
    split_axis: y
    label_column: group
    label_id_column: cell_id
    min_class_count: 25

phenocell:
  data:
    lmdb: ${CELLBRIDGE_DATA_ROOT}/eval/phenocell/phenocell_lmdb
    metadata: ${CELLBRIDGE_DATA_ROOT}/eval/phenocell/phenocell_info.csv
    split: ${CELLBRIDGE_DATA_ROOT}/eval/phenocell/splits/phenocell_dataset_split.csv
    image_shape: [1440, 1920]
    tile_size: 224
    value_scale: 250
  extraction:
    batch_size: 128
  probe:
    <<: *probe
    tasks: [all, immune]

pannuke:
  data:
    lmdb: ${CELLBRIDGE_DATA_ROOT}/eval/pannuke/pannuke_lmdb
    metadata: ${CELLBRIDGE_DATA_ROOT}/eval/pannuke/pannuke_info.csv
    split: ${CELLBRIDGE_DATA_ROOT}/eval/pannuke/splits/train_test_val_split.csv
    image_shape: [256, 256]
    tile_size: 224
    value_scale: 1
    allow_unlabeled_samples: true
  extraction:
    batch_size: 128
  probe:
    <<: *probe
    tasks: [all]
