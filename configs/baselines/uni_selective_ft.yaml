# Supervised selective fine-tuning control for Cellbridge (one seed only).
baseline:
  name: uni_selective_ft

seed: 0

model:
  # Always initialized from the original UNI2-h weights, not Cellbridge/TERRA.
  encoder: uni_v2
  weights_path: null
  image_dim: 1536
  trainable_blocks: 1

training:
  device: cuda
  batch_size: 48
  num_workers: 8
  max_epochs: 8
  patience: 2
  backbone_lr: 1.0e-5
  head_lr: 3.0e-4
  weight_decay: 0.05
  grad_clip: 1.0

output_dir: outputs/baselines/uni_selective_ft

hest:
  data_root: ${CELLBRIDGE_DATA_ROOT}/train/hest
  manifest_path: ${CELLBRIDGE_DATA_ROOT}/train/hest/manifest.csv
  splits_path: ${CELLBRIDGE_DATA_ROOT}/train/hest/splits/hest80_strict_v1.csv
  label_test_fast_path: ${CELLBRIDGE_DATA_ROOT}/train/hest/splits/label_test_fast_v1.csv
  label_test_fast_n: 5
  labels_pattern: "{data_root}/{sample_id}/{sample_id}_granular_cell_labels.csv"
  crop:
    target_size: 224
    target_pixel_size_um: 0.5
  evaluation:
    label_column: group
    label_id_column: cell_id
    min_class_count: 25
    test_frac: 0.2
    split_axis: y
    # Used only to choose the epoch; refit then uses the complete spatial 80%.
    validation_frac: 0.1

phenocell:
  data:
    lmdb: ${CELLBRIDGE_DATA_ROOT}/eval/phenocell/phenocell_lmdb
    metadata: ${CELLBRIDGE_DATA_ROOT}/eval/phenocell/phenocell_info.csv
    split: ${CELLBRIDGE_DATA_ROOT}/eval/phenocell/splits/phenocell_dataset_split.csv
    image_shape: [1440, 1920]
    tile_size: 224
    value_scale: 250
  crop:
    source_size: 96
    target_size: 224
  cache_dir: ${CELLBRIDGE_DATA_ROOT}/eval/phenocell/crops/crop_96px
  tasks: [all, immune]

pannuke:
  data:
    lmdb: ${CELLBRIDGE_DATA_ROOT}/eval/pannuke/pannuke_lmdb
    metadata: ${CELLBRIDGE_DATA_ROOT}/eval/pannuke/pannuke_info.csv
    split: ${CELLBRIDGE_DATA_ROOT}/eval/pannuke/splits/train_test_val_split.csv
    image_shape: [256, 256]
    tile_size: 224
    value_scale: 1
    allow_unlabeled_samples: true
  crop:
    source_size: 96
    target_size: 224
  cache_dir: ${CELLBRIDGE_DATA_ROOT}/eval/pannuke/crops/crop_96px
  tasks: [all]
